<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trailhead FAQ Bot</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    #log p { padding: 8px 12px; border-radius: 8px; }
    .you { background: #e8f0fe; } .bot { background: #f1f3f4; }
    form { display: flex; gap: 8px; } input { flex: 1; padding: 8px; } button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Trailhead FAQ Bot</h1>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="Ask about hours, returns, shipping..." autocomplete="off">
    <button>Send</button>
  </form>
  <script>
    const log = document.getElementById("log");
    function add(cls, text) {
      const p = document.createElement("p");
      p.className = cls; p.textContent = text; log.appendChild(p); return p;
    }
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const q = document.getElementById("q");
      const question = q.value.trim(); if (!question) return;
      add("you", question); q.value = "";
      const thinking = add("bot", "...");
      const res = await fetch(location.href, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question})
      });
      thinking.textContent = (await res.json()).answer;
    };
  </script>
</body>
</html>
